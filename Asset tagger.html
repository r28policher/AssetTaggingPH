<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset tagger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--ink:#14292E;--muted:#5B6E72;--line:#CBD5D3;
  --tag:#F5C518;--tag-ink:#14292E;--danger:#B3261E;--focus:#1B6F80;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B1E;--surface:#172A2E;--ink:#E7EEEC;--muted:#93A8AC;--line:#2B4247;
    --danger:#FF8A80;--focus:#6CC4D6;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B1E;--surface:#172A2E;--ink:#E7EEEC;--muted:#93A8AC;--line:#2B4247;
  --danger:#FF8A80;--focus:#6CC4D6;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.tag{display:flex;align-items:center;gap:14px;background:var(--tag);color:var(--tag-ink);
  padding:16px 20px 16px 16px;border-radius:6px 28px 28px 6px;margin-bottom:20px}
.tag .hole{flex:none;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tag h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.tag p{margin:2px 0 0;font-size:.9rem;font-weight:600}

section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:20px}
h2{margin:0 0 12px;font-size:1.05rem;font-weight:800}
label.lbl{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px}
input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:8px;padding:12px;min-height:48px}
.row{display:flex;gap:10px;align-items:stretch}
.qty{display:flex;align-items:stretch;gap:8px}
.qty input{text-align:center;width:90px}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);
  border-radius:8px;min-height:48px;padding:0 16px;cursor:pointer}
button:active{transform:translateY(1px)}
button.sq{width:48px;padding:0;font-size:1.3rem}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%;margin-top:18px;font-weight:800}
button.alt{background:var(--tag);color:var(--tag-ink);border-color:var(--tag);font-weight:800}
button:disabled{opacity:.45;cursor:not-allowed}
.photo-actions{display:flex;gap:10px;flex-wrap:wrap}
.photo-actions button{flex:1 1 140px}
.preview{display:flex;align-items:center;gap:12px;margin-top:12px}
.preview img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.link{border:0;background:none;min-height:40px;padding:0 4px;color:var(--danger);text-decoration:underline}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 100px;display:flex;align-items:center;justify-content:center;gap:8px}
.chip::before,.badge::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--bg)}
.badge{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;min-height:32px;padding:0 12px 0 10px;border-radius:999px;background:var(--bg);margin:4px 0 2px}
.badge::before{width:8px;height:8px}
[data-s="Working"]{--c:#2E9E5B}[data-s="For Repair"]{--c:#E0A100}[data-s="Defective"]{--c:#D64545}
.sn{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h2{margin:0}
.sum{color:var(--muted);font-size:.9rem;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
li .ph{width:64px;height:64px;border-radius:8px;background:var(--bg);border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.7rem;text-align:center;overflow:hidden}
li .ph img{width:100%;height:100%;object-fit:cover;display:block}
li .nm{font-weight:600;overflow-wrap:anywhere}
li .meta{color:var(--muted);font-size:.8rem}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;min-height:36px;padding:0;font-size:1.1rem}
.step b{min-width:28px;text-align:center}
.del{grid-column:2/4;justify-self:end;margin-top:-4px}
.empty{color:var(--muted);padding:16px 0 4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <div class="tag">
    <span class="hole" aria-hidden="true"></span>
    <div><h1>Asset tagger</h1><p id="count">0 items logged</p></div>
  </div>

  <section aria-labelledby="addh">
    <h2 id="addh">Add an asset</h2>

    <label class="lbl" for="name">Asset tag or name</label>
    <input type="text" id="name" autocomplete="off" placeholder="e.g. AT-0142 or Dell monitor">

    <label class="lbl" for="serial">Serial number / model <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input type="text" id="serial" autocomplete="off" placeholder="e.g. SN 4821-AX or TP-Link ER605">

    <label class="lbl" id="stl">Status</label>
    <div class="chips" role="group" aria-labelledby="stl">
      <button type="button" class="chip" data-s="Working" aria-pressed="true">Working</button>
      <button type="button" class="chip" data-s="For Repair" aria-pressed="false">For Repair</button>
      <button type="button" class="chip" data-s="Defective" aria-pressed="false">Defective</button>
    </div>

    <label class="lbl" for="qty">Quantity</label>
    <div class="qty">
      <button type="button" class="sq" id="minus" aria-label="Decrease quantity">−</button>
      <input type="number" id="qty" value="1" min="1" step="1" inputmode="numeric">
      <button type="button" class="sq" id="plus" aria-label="Increase quantity">+</button>
    </div>

    <label class="lbl">Photo</label>
    <div class="photo-actions">
      <button type="button" id="cam">Take photo</button>
      <button type="button" id="up">Upload photo</button>
    </div>
    <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fup" accept="image/*" hidden>
    <div class="preview" id="preview" hidden>
      <img id="pimg" alt="Photo of the asset you’re adding">
      <button type="button" class="link" id="rmph">Remove photo</button>
    </div>

    <button type="button" class="primary" id="add">Add asset</button>
  </section>

  <section aria-labelledby="listh">
    <div class="head">
      <h2 id="listh">Asset list</h2>
      <button type="button" class="alt" id="export" disabled>Download Excel</button>
    </div>
    <p class="sum" id="sum"></p>
    <ul id="list"></ul>
    <p class="empty" id="empty">No assets yet. Add the first one above.</p>
    <button type="button" class="link" id="clear" hidden>Clear all assets</button>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
let items = [], photo = null, tt, status = 'Working';
const ORDER = ['Working', 'For Repair', 'Defective'];

try { items = JSON.parse(localStorage.getItem('assets') || '[]'); } catch (e) { items = []; }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200);
}
function persist() {
  try { localStorage.setItem('assets', JSON.stringify(items)); }
  catch (e) { toast('Storage is full. Download your list, then clear it.'); }
}

function readPhoto(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, 800 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function pick(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { photo = await readPhoto(f); showPreview(); }
  catch (err) { toast('That file couldn’t be read as an image. Try another photo.'); }
}
function showPreview() {
  $('#preview').hidden = !photo;
  if (photo) $('#pimg').src = photo;
}

function qtyVal() { return Math.max(1, parseInt($('#qty').value, 10) || 1); }
function setStatus(s) {
  status = s;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.s === s));
}

function addItem() {
  const name = $('#name').value.trim();
  if (!name) { toast('Enter an asset tag or name first.'); $('#name').focus(); return; }
  items.push({ id: Date.now() + Math.random(), name, serial: $('#serial').value.trim(), status, qty: qtyVal(), photo, ts: Date.now() });
  persist();
  $('#name').value = ''; $('#serial').value = ''; $('#qty').value = 1; photo = null; showPreview(); setStatus('Working');
  render(); $('#name').focus(); toast('Added “' + name + '”.');
}

function render() {
  const ul = $('#list'); ul.textContent = '';
  items.forEach(it => {
    const li = document.createElement('li');

    const ph = document.createElement('div'); ph.className = 'ph';
    if (it.photo) { const im = document.createElement('img'); im.src = it.photo; im.alt = 'Photo of ' + it.name; ph.appendChild(im); }
    else ph.textContent = 'No photo';

    const info = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
    const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = new Date(it.ts).toLocaleString();
    info.append(nm);
    if (it.serial) { const sn = document.createElement('div'); sn.className = 'sn'; sn.textContent = 'Serial / model: ' + it.serial; info.append(sn); }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'badge';
    if (it.status) b.dataset.s = it.status;
    b.textContent = it.status || 'Set status';
    b.setAttribute('aria-label', 'Status of ' + it.name + ': ' + (it.status || 'not set') + '. Tap to change.');
    b.onclick = () => { it.status = ORDER[(ORDER.indexOf(it.status) + 1) % ORDER.length]; persist(); render(); };
    info.append(b, meta);

    const step = document.createElement('div'); step.className = 'step';
    const m = document.createElement('button'); m.type = 'button'; m.textContent = '−'; m.setAttribute('aria-label', 'Decrease quantity of ' + it.name);
    const q = document.createElement('b'); q.textContent = it.qty;
    const p = document.createElement('button'); p.type = 'button'; p.textContent = '+'; p.setAttribute('aria-label', 'Increase quantity of ' + it.name);
    m.onclick = () => { if (it.qty > 1) { it.qty--; persist(); render(); } };
    p.onclick = () => { it.qty++; persist(); render(); };
    step.append(m, q, p);

    const del = document.createElement('button'); del.type = 'button'; del.className = 'link del'; del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete ' + it.name);
    del.onclick = () => { items = items.filter(x => x.id !== it.id); persist(); render(); };

    li.append(ph, info, step, del);
    ul.appendChild(li);
  });
  const total = items.reduce((s, i) => s + i.qty, 0);
  $('#count').textContent = items.length + (items.length === 1 ? ' item logged' : ' items logged');
  $('#sum').textContent = items.length ? total + ' units across ' + items.length + (items.length === 1 ? ' line' : ' lines') : '';
  $('#empty').hidden = items.length > 0;
  $('#export').disabled = !items.length;
  $('#clear').hidden = !items.length;
}

async function exportXlsx() {
  if (!items.length) return;
  const btn = $('#export'); btn.disabled = true;
  try {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Assets');
    ws.columns = [
      { header: 'No.', key: 'n', width: 6 },
      { header: 'Asset tag / name', key: 'name', width: 32 },
      { header: 'Serial / model', key: 'sn', width: 24 },
      { header: 'Status', key: 's', width: 13 },
      { header: 'Quantity', key: 'q', width: 11 },
      { header: 'Photo', key: 'p', width: 16 },
      { header: 'Added', key: 'd', width: 20 }
    ];
    ws.getRow(1).font = { bold: true };
    items.forEach((it, i) => {
      const r = ws.addRow({ n: i + 1, name: String(it.name), sn: String(it.serial || ''), s: it.status || '', q: it.qty, d: new Date(it.ts).toLocaleString() });
      r.alignment = { vertical: 'middle', wrapText: true };
      const fills = { 'Working': 'FFC8E6C9', 'For Repair': 'FFFFE08A', 'Defective': 'FFF5B7B1' };
      if (fills[it.status]) r.getCell('s').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fills[it.status] } };
      if (it.photo) {
        r.height = 75;
        const id = wb.addImage({ base64: it.photo, extension: 'jpeg' });
        ws.addImage(id, { tl: { col: 5.1, row: i + 1.1 }, ext: { width: 90, height: 90 } });
      }
    });
    const tot = ws.addRow({ name: 'Total units', q: items.reduce((s, i) => s + i.qty, 0) });
    tot.font = { bold: true };

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const filename = 'asset-list-' + new Date().toISOString().slice(0, 10) + '.xlsx';

    let dl = null;
    try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      await dl.save({ filename, data: blob });
      toast('Excel file saved.');
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      toast('Excel file ready.');
    }
  } catch (err) {
    if (err && err.code === 'declined') toast('Download canceled.');
    else toast('The Excel file couldn’t be created. Try again.');
  } finally { btn.disabled = !items.length; }
}

$('#cam').onclick = () => $('#fcam').click();
$('#up').onclick = () => $('#fup').click();
$('#fcam').onchange = pick; $('#fup').onchange = pick;
$('#rmph').onclick = () => { photo = null; showPreview(); };
$('#minus').onclick = () => { $('#qty').value = Math.max(1, qtyVal() - 1); };
$('#plus').onclick = () => { $('#qty').value = qtyVal() + 1; };
$('#add').onclick = addItem;
document.querySelectorAll('.chip').forEach(c => { c.onclick = () => setStatus(c.dataset.s); });
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
$('#export').onclick = exportXlsx;
$('#clear').onclick = () => {
  if (confirm('Delete all ' + items.length + ' assets? Download the Excel file first if you need a copy.')) { items = []; persist(); render(); }
};
render();
</script>
</body>
</html>
